<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>PAC III — Controle do Estúdio</title><style>
:root{--bg:#071326;--p:#0d1e36;--b:#29496d;--t:#f6fbff;--m:#9fb5d4;--c:#32d5ff;--g:#4ade80;--y:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16365d,#071326 50%);color:var(--t);font-family:Inter,system-ui,sans-serif;min-height:100vh}main{max-width:620px;margin:auto;padding:14px}.card{background:#0a192e;border:1px solid var(--b);border-radius:19px;padding:17px;margin-bottom:11px}h1{font-size:24px;margin:4px 0 12px}.muted{color:var(--m);font-size:12px}select,button{font:inherit}select{width:100%;padding:14px;border-radius:12px;background:#112943;color:white;border:1px solid var(--b)}button{border:0;border-radius:15px;color:white;font-weight:1000}.join{width:100%;padding:14px;margin-top:9px;background:#087ea4}.turn{padding:18px;width:100%;background:#176b3a;font-size:19px}.turn:disabled{opacity:.35}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ans{height:95px;font-size:38px;background:#173a58;border:2px solid #315b7f}.ans.sel{outline:4px solid var(--y);background:#4a4618}.ans:disabled{opacity:.3}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{text-align:center;background:#10243c;border:1px solid var(--b);padding:9px;border-radius:11px}.metric b{display:block;font-size:23px}.powers{display:flex;gap:7px;flex-wrap:wrap}.power{padding:10px;background:#4d3572}.path{display:grid;grid-template-columns:1fr 1fr;gap:8px}.path button{padding:16px;background:#31506e}.status{font-weight:900;margin-top:8px}.ok{color:#86efac}.wait{color:#fde68a}
</style></head><body><main>
<div class="card"><div class="muted">PAC III • Game Jam</div><h1>🎮 Controle do Estúdio</h1><div id="join"><select id="sel"></select><button class="join" id="joinBtn">ENTRAR COMO ESTÚDIO</button></div><div id="locked" class="status ok" style="display:none"></div></div>
<div class="card"><div class="muted">Meu turno</div><h1 id="turnTitle">Aguardando...</h1><button class="turn" id="roll" disabled>🎲 ROLAR DADO</button><div id="path" class="path" style="display:none;margin-top:9px"><button data-p="risk">⬆️ EXPLORAR<br><small>risco + recompensa</small></button><button data-p="safe">➡️ ROTA SEGURA<br><small>+1 XP</small></button></div><div id="turnMsg" class="status wait">Aguarde seu turno.</div></div>
<div class="card"><div class="muted">Playtest / Questão</div><h1 id="voteTitle">Aguardando questão</h1><div class="answers" id="answers"></div><div id="voteMsg" class="status wait">Os botões serão liberados quando seu estúdio puder responder.</div></div>
<div class="card"><div class="muted">Meu estúdio</div><div class="metrics"><div class="metric">XP<b id="pts">—</b></div><div class="metric">Casa<b id="pos">—</b></div><div class="metric">Mundo<b id="world">—</b></div></div><div class="powers" style="margin-top:10px"><button class="power" data-power="insight">💡 Insight <span id="pi">0</span></button><button class="power" data-power="hotfix">🔧 Hotfix <span id="ph">0</span></button><button class="power" data-power="pivot">🔄 Pivot <span id="pp">0</span></button></div><div id="myStatus" class="status"></div></div>
</main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let my=localStorage.getItem('pac3StudioId')||null,g=null,vote=null,choice=null;
function answers(n=4){$('answers').innerHTML=['A','B','C','D'].slice(0,n).map((x,i)=>`<button class="ans" data-i="${i}" disabled>${x}</button>`).join('');document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>cast(+b.dataset.i))}
answers();
function me(){return g?.teams?.find(t=>t.id===my)}function phase(p){return p<=6?'1':p<=12?'2':p<=18?'3':'4'}
function render(){if(!g)return;$('sel').innerHTML=g.teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');let t=me(),cur=g.teams[g.turnIndex];if(t){$('join').style.display='none';$('locked').style.display='block';$('locked').textContent='🔒 '+t.name;$('pts').textContent=t.points;$('pos').textContent=t.pos;$('world').textContent=phase(t.pos);$('pi').textContent=t.inventory?.insight||0;$('ph').textContent=t.inventory?.hotfix||0;$('pp').textContent=t.inventory?.pivot||0;$('myStatus').textContent=t.blocked?'😵 CRUNCH — perderá o próximo turno':'🟢 Em produção';let mine=cur?.id===my;$('turnTitle').textContent=mine?'🚀 É O SEU TURNO':`⏳ ${cur?.name||'Outro estúdio'} está jogando`;$('roll').disabled=!mine||!!t.pendingRoll||!!t.blocked;$('turnMsg').textContent=t.blocked&&mine?'Seu estúdio está em Crunch. O Game Master consumirá o bloqueio.':t.pendingRoll?`🎲 Dado: ${t.pendingRoll}. Aguarde o movimento.`:mine?'Role o dado para iniciar sua jogada.':'Acompanhe o mapa no projetor.';$('path').style.display=mine&&t.pendingPath?'grid':'none'}applyVote()}
function applyVote(){let t=me(),eligible=vote?.eligibleTeamIds?.includes(my),open=vote?.open&&eligible&&!t?.blocked;document.querySelectorAll('.ans').forEach(b=>{b.disabled=!open;b.classList.toggle('sel',choice!==null&&+b.dataset.i===choice)});if(vote?.open){$('voteTitle').textContent=eligible?'Escolha sua decisão':'Acompanhe o desafio';$('voteMsg').textContent=eligible?(choice!==null?'✅ Registrada. Pode alterar até o tempo acabar.':'Converse com seu estúdio e responda.'):'Seu estúdio não participa desta votação.'}else{$('voteTitle').textContent='Aguardando questão';$('voteMsg').textContent='Os botões serão liberados quando seu estúdio puder responder.'}}
$('joinBtn').onclick=()=>{my=$('sel').value;localStorage.setItem('pac3StudioId',my);socket.emit('student:join',{teamId:my},a=>{if(!a?.ok)alert(a?.message||'Erro');render()})};
$('roll').onclick=()=>socket.emit('student:roll',{teamId:my},a=>{if(!a?.ok)$('turnMsg').textContent=a?.message||'Não foi possível rolar.'});
document.querySelectorAll('#path button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#path button').forEach(x=>x.disabled=true);
 $('turnMsg').textContent='Registrando rota...';
 socket.emit('student:path',{teamId:my,choice:b.dataset.p},a=>{
   if(!a?.ok){document.querySelectorAll('#path button').forEach(x=>x.disabled=false);$('turnMsg').textContent=a?.message||'Erro ao escolher rota.';return}
   $('path').style.display='none';
   $('turnMsg').textContent=a?.result?.message||'Rota registrada. Acompanhe o resultado no projetor.';
 });
});
document.querySelectorAll('.power').forEach(b=>b.onclick=()=>socket.emit('student:power',{teamId:my,power:b.dataset.power},a=>{$('myStatus').textContent=a?.message||'Solicitação enviada.'}));
function cast(i){if(!vote?.open)return;let old=choice;choice=i;applyVote();socket.emit('student:vote',{voteId:vote.voteId,teamId:my,choice:i},a=>{if(!a?.ok){choice=old;applyVote();$('voteMsg').textContent=a?.message||'Erro'}})}
socket.on('connect',()=>socket.emit('student:hello',{teamId:my}));
socket.on('game:reset',()=>{localStorage.removeItem('pac3StudioId');my=null;vote=null;choice=null;$('join').style.display='block';$('locked').style.display='none';$('turnTitle').textContent='Aguardando nova partida...';$('turnMsg').textContent='O Game Master reiniciou a Game Jam.';answers();applyVote()});
socket.on('game:state',x=>{g=x;render()});socket.on('vote:open',x=>{vote=x;choice=x.currentChoices&&Object.prototype.hasOwnProperty.call(x.currentChoices,my)?+x.currentChoices[my]:null;answers(x.optionCount||4);applyVote()});socket.on('vote:closed',()=>{vote=null;choice=null;applyVote()});socket.on('game:pathResolved',r=>{if(r.teamId===my){$('path').style.display='none';$('turnMsg').textContent=r.message;}});
</script></body></html>
