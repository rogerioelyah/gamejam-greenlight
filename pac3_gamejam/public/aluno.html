<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Game Jam — Controle</title><script src="/socket.io/socket.io.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#06101d;color:#eef7ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:16px}.card{width:min(520px,100%);background:#0d1d31;border:1px solid #29435f;border-radius:24px;padding:22px;text-align:center}.ey{color:#7dd3fc;font-size:11px;font-weight:1000;letter-spacing:.12em}.name{font-size:28px;font-weight:1000;margin:8px}.msg{color:#9db5cc;margin:10px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.ans{height:110px;border:1px solid #355774;border-radius:18px;background:#10263a;color:white;font-size:34px;font-weight:1000}.ans.sel{background:#075985;outline:4px solid #38bdf8}.ans:disabled{opacity:.35}.ok{padding:12px;border-radius:12px;background:#14532d;color:#bbf7d0;margin-top:14px}.bad{padding:12px;border-radius:12px;background:#7f1d1d;color:#fecaca;margin-top:14px}.teams{display:grid;gap:8px;margin-top:16px}.team{padding:13px;border:0;border-radius:12px;background:#1c3653;color:white;font-weight:900}.ver{position:fixed;right:4px;bottom:3px;opacity:.2;font-size:8px}</style></head><body>
<div class="card"><div class="ey">CONTROLE DO ESTÚDIO</div><div id="name" class="name">Conectando...</div><div id="msg" class="msg">Aguarde.</div><div id="join" class="teams"></div><div id="answers" class="answers"></div><div id="ack"></div></div><div class="ver">v4.0.0-clean</div>
<script>
const socket=io(),$=id=>document.getElementById(id),LET=['A','B','C','D'];let me=null,state=null,vote=null,choice=null;
const qp=new URLSearchParams(location.search),requested=qp.get('team');
socket.on('hello',d=>{state=d.state;renderJoin();if(requested&&!me)join(requested)});
socket.on('state',s=>{state=s;if(me){const t=s.teams.find(x=>x.id===me);$('name').textContent=t?.name||me}});
socket.on('connect',()=>{if(me)join(me)});
function renderJoin(){if(me||!state)return;$('name').textContent='Escolha seu estúdio';$('msg').textContent='Cada equipe mantém este controle durante toda a partida.';$('join').innerHTML=state.teams.map(t=>`<button class="team" ${t.socketId?'disabled':''} onclick="join('${t.id}')">${t.name}${t.socketId?' • conectado':''}</button>`).join('')}
function join(id){socket.emit('student:join',{teamId:id},r=>{if(!r?.ok){$('ack').className='bad';$('ack').textContent=r?.error||'Não foi possível conectar.';return}me=id;state=r.state;$('join').innerHTML='';$('name').textContent=r.team.name;$('msg').textContent='Controle conectado. Aguarde o próximo desafio.';$('ack').textContent='';if(r.vote)openVote(r.vote)})}
socket.on('vote:open',openVote);function openVote(v){vote=v;choice=v.responses&&Object.prototype.hasOwnProperty.call(v.responses,me)?+v.responses[me]:null;if(!me||!v.eligible.includes(me)){$('answers').innerHTML='';$('msg').textContent='Sua equipe não participa deste desafio.';return}$('msg').textContent=v.kind==='battle'?'⚔️ Sua equipe está na Battle. Responda!':'🎯 Responda antes do tempo acabar. Você pode alterar o voto.';$('answers').innerHTML=v.question.options.map((_,i)=>`<button class="ans ${choice===i?'sel':''}" onclick="sendVote(${i})">${LET[i]}</button>`).join('');$('ack').textContent=''}
function sendVote(i){if(!vote?.open)return;socket.emit('student:vote',{voteId:vote.id,choice:i},r=>{if(!r?.ok){$('ack').className='bad';$('ack').textContent='⚠️ '+r.error;return}choice=i;document.querySelectorAll('.ans').forEach((b,k)=>b.classList.toggle('sel',k===i));$('ack').className='ok';$('ack').textContent=`✅ Voto ${LET[i]} computado pelo servidor (${r.count}/${r.total}). Você ainda pode alterar.`})}
socket.on('vote:tick',d=>{if(vote&&d.voteId===vote.id)$('msg').textContent=`⏱️ ${d.remaining}s para responder. Você pode alterar o voto.`});
socket.on('vote:result',d=>{if(!vote||d.voteId!==vote.id)return;document.querySelectorAll('.ans').forEach(b=>b.disabled=true);const r=d.results[me];$('ack').className=r?.correct?'ok':'bad';$('ack').textContent=r?.correct?'✅ Sua equipe acertou!':'❌ Sua equipe não acertou desta vez.';$('msg').textContent='Resultado exibido no telão.';setTimeout(()=>{$('answers').innerHTML='';$('ack').textContent='';$('msg').textContent='Aguarde o próximo desafio.';vote=null},4500)});
socket.on('notice',d=>{if(me)$('msg').textContent=d.body});
</script></body></html>
