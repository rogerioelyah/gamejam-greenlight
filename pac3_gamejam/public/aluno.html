<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Game Jam — Controle</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06101d;color:#eef7ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:16px}.card{width:min(520px,100%);background:#0d1d31;border:1px solid #29435f;border-radius:24px;padding:22px;text-align:center}.ey{color:#7dd3fc;font-size:11px;font-weight:1000;letter-spacing:.12em}.name{font-size:28px;font-weight:1000;margin:8px}.msg{color:#9db5cc;margin:10px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.ans{height:110px;border:1px solid #355774;border-radius:18px;background:#10263a;color:white;font-size:34px;font-weight:1000}.ans.sel{background:#075985;outline:4px solid #38bdf8}.ans:disabled{opacity:.35}.ok{padding:12px;border-radius:12px;background:#14532d;color:#bbf7d0;margin-top:14px}.bad{padding:12px;border-radius:12px;background:#7f1d1d;color:#fecaca;margin-top:14px}.rollBtn{width:100%;height:90px;margin:14px 0;border:0;border-radius:18px;background:#0ea5e9;color:white;font-size:25px;font-weight:1000}.rollBtn:disabled{opacity:.38}.teams{display:grid;gap:8px;margin-top:16px}.team{padding:13px;border:0;border-radius:12px;background:#1c3653;color:white;font-weight:900}.team:disabled{opacity:.35}.ver{position:fixed;right:4px;bottom:3px;opacity:.2;font-size:8px}.traceBtn{position:fixed;left:7px;bottom:7px;z-index:999;width:30px;height:30px;border:0;border-radius:50%;background:#0ea5e9;color:white;opacity:.35}.trace{position:fixed;left:8px;bottom:42px;z-index:1000;width:min(650px,94vw);height:60vh;background:#02070ff8;border:1px solid #355774;border-radius:15px;display:none;padding:10px}.trace.show{display:flex;flex-direction:column}.trace pre{flex:1;overflow:auto;white-space:pre-wrap;font:10px ui-monospace;color:#b9d7ff;text-align:left}</style></head><body>
<div class="card"><div class="ey">CONTROLE DO ESTÚDIO</div><div id="name" class="name">Conectando...</div><div id="msg" class="msg">Aguarde.</div><div id="rollBox"></div><div id="join" class="teams"></div><div id="answers" class="answers"></div><div id="ack"></div></div><div class="ver">v4.2.6-global-question-bank</div><button id="traceBtn" class="traceBtn">⌁</button><div id="trace" class="trace"><button id="copyTrace">Copiar</button><button id="closeTrace">Fechar</button><pre id="traceBody"></pre></div>
<script>
const $=id=>document.getElementById(id),LET=['A','B','C','D'];
let S=null,
    me=localStorage.getItem('gamejam_team'),
    sessionSeen=localStorage.getItem('gamejam_session'),
    controlId=localStorage.getItem('gamejam_control')||`C-${Date.now()}-${Math.random().toString(36).slice(2)}`,
    vote=null,choice=null,trace=[];
localStorage.setItem('gamejam_control',controlId);
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j}function tr(type,data={}){trace.push({at:new Date().toISOString(),type,data});if(trace.length>200)trace.shift();$('traceBody').textContent=trace.map(x=>`[${x.at}] ${x.type}\n${JSON.stringify(x.data,null,2)}`).join('\n\n')}
const es=new EventSource('/events');es.onopen=()=>tr('sse:open');es.onerror=()=>tr('sse:error');['hello','state','dice:rolling','dice:result','vote:open','vote:tick','vote:progress','vote:result','notice','reset'].forEach(ev=>es.addEventListener(ev,e=>handle(ev,JSON.parse(e.data))));
function handle(ev,d){tr(ev,d);if(ev==='hello'||ev==='state'){
 const incoming=d.state||d;
 if(incoming.sessionId){
   if(sessionSeen&&incoming.sessionId!==sessionSeen){
     me=null;vote=null;choice=null;
     localStorage.removeItem('gamejam_team');
     localStorage.removeItem('gamejam_control');
     controlId=`C-${Date.now()}-${Math.random().toString(36).slice(2)}`;
     localStorage.setItem('gamejam_control',controlId);
     $('answers').innerHTML='';$('ack').textContent='';
   }
   sessionSeen=incoming.sessionId;
   localStorage.setItem('gamejam_session',sessionSeen);
 }
 S=incoming;renderState();return
}if(ev==='reset'){me=null;vote=null;choice=null;sessionSeen=null;localStorage.clear();sessionStorage.clear();location.reload();return}if(ev==='dice:rolling'){if(me===d.teamId){$('msg').textContent='🎲 Dado rolando no telão...';renderRollControl()}return}
if(ev==='dice:result'){if(me===d.teamId)$('msg').textContent=`🎲 Resultado: ${d.value}. Acompanhe o movimento no telão.`;return}
if(ev==='vote:open'){openVote(d);return}if(ev==='vote:tick'){if(vote&&d.voteId===vote.id)$('msg').textContent=`⏱️ ${d.remaining}s para responder. Você pode alterar o voto.`;return}if(ev==='vote:result'){if(vote&&d.voteId===vote.id){document.querySelectorAll('.ans').forEach(b=>b.disabled=true);const r=d.results[me];$('ack').className=r?.correct?'ok':'bad';$('ack').textContent=r?.correct?'✅ Sua equipe acertou!':'❌ Sua equipe não acertou desta vez.';$('msg').textContent='Resultado exibido no telão.';setTimeout(()=>{$('answers').innerHTML='';$('ack').textContent='';$('msg').textContent='Aguarde o próximo desafio.';vote=null},3800)}return}if(ev==='notice'&&me){$('msg').textContent=d.body}}
function renderRollControl(){
 const box=$('rollBox');if(!box||!S||!me){if(box)box.innerHTML='';return}
 const actor=S.teams[S.turn];
 if(!S.started){box.innerHTML='';return}
 if(!actor){box.innerHTML='';return}
 if(actor.id===me&&S.phase==='TURN'&&!actor.blocked&&!S.vote){
   box.innerHTML='<button class="rollBtn" onclick="rollDice()">🎲 ROLAR DADO</button>';
 }else if(actor.id===me&&actor.blocked){
   box.innerHTML='<div class="msg">💥 Seu estúdio está em Crunch e perde este turno.</div>';
 }else{
   box.innerHTML=`<div class="msg">Aguardando jogada de <b>${actor.name}</b>.</div>`;
 }
}
async function rollDice(){
 try{
   const r=await api('/api/roll',{teamId:me,controlId});
   if(!r.ok)throw new Error(r.error||'Não foi possível rolar o dado.');
   $('rollBox').innerHTML='<button class="rollBtn" disabled>🎲 DADO LANÇADO...</button>';
   tr('dice:roll:ack',r);
 }catch(e){
   $('ack').className='bad';$('ack').textContent='⚠️ '+e.message;tr('dice:roll:error',{message:e.message});
 }
}
function renderState(){if(!S)return;if(me){const t=S.teams.find(x=>x.id===me);if(t){$('name').textContent=t.name;$('join').innerHTML='';heartbeat();if(S.vote?.open)openVote(S.vote);renderRollControl();return}else{me=null;localStorage.removeItem('gamejam_team')}}$('name').textContent='Escolha seu estúdio';$('msg').textContent='O controle ficará vinculado a esta equipe durante a partida.';renderRollControl();$('join').innerHTML=S.teams.map(t=>`<button class="team" ${t.joined?'disabled':''} onclick="join('${t.id}')">${t.name}${t.joined?' • ocupado':''}</button>`).join('')}
async function join(id){try{const r=await api('/api/join',{teamId:id,controlId});me=id;localStorage.setItem('gamejam_team',id);localStorage.setItem('gamejam_control',controlId);if(r.state?.sessionId){sessionSeen=r.state.sessionId;localStorage.setItem('gamejam_session',sessionSeen)}S=r.state;$('name').textContent=r.team.name;$('join').innerHTML='';$('msg').textContent='Controle conectado. Aguarde o desafio.';tr('join:ok',r.team);heartbeat();if(S.vote?.open)openVote(S.vote)}catch(e){$('ack').className='bad';$('ack').textContent=e.message}}
let pingIv=null;function heartbeat(){clearInterval(pingIv);if(!me)return;api('/api/ping',{teamId:me,controlId}).catch(()=>{});pingIv=setInterval(()=>api('/api/ping',{teamId:me,controlId}).catch(()=>{}),5000)}
function openVote(v){vote=v;choice=Object.prototype.hasOwnProperty.call(v.responses||{},me)?+v.responses[me]:null;if(!me||!v.eligible.includes(me)){$('answers').innerHTML='';$('msg').textContent='Sua equipe acompanha este desafio, mas não responde.';return}$('msg').textContent=v.kind==='battle'?'⚔️ Sua equipe está na Battle. Responda!':v.kind==='pitch-final'?`🏰 Pitch Day ${v.pitchStep}/5 — responda!`:'🎯 Responda antes do tempo acabar. Você pode alterar o voto.';$('answers').innerHTML=v.question.options.map((_,i)=>`<button class="ans ${choice===i?'sel':''}" onclick="sendVote(${i})">${LET[i]}</button>`).join('');$('ack').textContent=''}
async function sendVote(i){if(!vote?.open)return;try{const r=await api('/api/vote',{voteId:vote.id,teamId:me,controlId,choice:i});choice=i;document.querySelectorAll('.ans').forEach((b,k)=>b.classList.toggle('sel',k===i));$('ack').className='ok';$('ack').textContent=`✅ Voto ${LET[i]} computado pelo servidor (${r.count}/${r.total}). Você ainda pode alterar.`;tr('vote:ack',r)}catch(e){$('ack').className='bad';$('ack').textContent='⚠️ '+e.message;tr('vote:error',{message:e.message})}}
$('traceBtn').onclick=()=> $('trace').classList.add('show');$('closeTrace').onclick=()=> $('trace').classList.remove('show');$('copyTrace').onclick=async()=>navigator.clipboard.writeText($('traceBody').textContent);document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='t')$('traceBtn').click()});fetch('/api/state').then(r=>r.json()).then(s=>{S=s;renderState()});
</script></body></html>
